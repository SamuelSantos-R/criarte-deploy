appId: ao.criarte.studio
productName: Criarte Studio
copyright: Criarte Design AO

directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json

# O CLI viaja junto: o app roda cli.mjs com o próprio binário do Electron
# (ELECTRON_RUN_AS_NODE), então a máquina não precisa ter Node instalado.
extraResources:
  - from: ../cli.mjs
    to: cli/cli.mjs
  - from: ../banner.mjs
    to: cli/banner.mjs
  - from: ../package.json
    to: cli/package.json
  - from: ../src
    to: cli/src
  - from: ../templates
    to: cli/templates
  # Peças da tokenização, copiadas para o convite quando o Heatz manda injetar.
  - from: resources/token
    to: token
  # As alianças do RSVP. Viajam no app porque semear a secção num convite que
  # ainda não tem a imagem deixaria a página a apontar pro vazio.
  - from: resources/rsvp
    to: rsvp
  # O componente de cada secção que o Studio sabe criar. Sem ele a chave nascia
  # no convite.json e a página não tinha nada para desenhar.
  - from: resources/secoes
    to: secoes
  # Fontes e moldura do monograma. A Milton One é licença da Criarte: viaja só
  # dentro do app, nunca sobe pro R2 nem vai parar num convite.
  - from: resources/monograma
    to: monograma
  - from: ../node_modules
    to: cli/node_modules
    filter:
      - "**/*"
      - "!**/*.md"
      - "!**/test/**"
      - "!**/.bin/**"

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  darkModeSupport: true
  target:
    - target: dmg
      arch:
        - x64
  # Ferramenta interna, sem conta de developer: assinatura ad-hoc. Hardened
  # runtime quebraria o ELECTRON_RUN_AS_NODE que roda o CLI.
  identity: null
  hardenedRuntime: false
  # Sem esta chave o macOS 14 deita fora a difusão UDP do farol sem avisar, e o
  # "perto daqui" fica eternamente vazio. É ela que faz aparecer o pedido de
  # Rede Local com o nosso texto, em vez do genérico que passa despercebido.
  extendInfo:
    NSLocalNetworkUsageDescription: >-
      O Criarte Studio procura outros Studios na rede de casa para vocês
      editarem o mesmo convite em coop.

win:
  # O .ico sai do PNG de 1024 na hora do build — não há ficheiro de ícone
  # separado a manter desalinhado com o do macOS.
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  # Instala por utilizador: sem isto o instalador pede administrador, e a
  # máquina do cunhado não tem essa senha à mão.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Criarte Studio
  # Remove todas as versões anteriores antes de instalar (mesmo noutra pasta)
  # e põe "Desinstalar Criarte Studio" no menu Iniciar. Ver o .nsh.
  include: resources/installer.nsh
  uninstallDisplayName: Criarte Studio
  deleteAppDataOnUninstall: false

dmg:
  title: Criarte Studio
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

npmRebuild: false
